<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Oh!!牌牌</title>
<meta name="theme-color" content="#24101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oh!!牌牌">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Layout: a felt mahjong table (four rivers around a centre plate) with the hand in one row beneath, like an online parlour. */
  :root {
    color-scheme: dark;
    --bg: #24101f;
    --panel: #371a2e;
    --panel-hi: #472140;
    --line: #6a2f55;
    --ink: #fff1f5;
    --muted: #e0a9bf;
    --brass: #ffb0c8;
    --brass-ink: #3a0f26;
    --good: #7fe3b0;
    --bad: #ff8f7e;
    --dim: #a8708c;
    --felt-hi: #d4607f;
    --felt-lo: #8c2f55;
    --wood: #7a3550;
    --tile-hi: #fffdf6;
    --tile-lo: #ebe3c7;
    --jade: #f06292;
    --font-display: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK JP", "BIZ UDPMincho", serif;
    --font-title: "Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
  --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    background: radial-gradient(120% 60% at 50% 0%, #4a1c3d 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    padding-block: 12px 36px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  h1, h2, h3, p { margin: 0; }

  /* ---------- tiles ---------- */
  .tile {
    --tw: 40px;
    appearance: none;
    border: 0;
    padding: calc(var(--tw) * 0.07) calc(var(--tw) * 0.06);
    position: relative;
    flex: none;
    display: block;
    width: var(--tw);
    aspect-ratio: 5 / 7;
    border-radius: calc(var(--tw) * 0.13);
    background: linear-gradient(180deg, var(--tile-hi), var(--tile-lo));
    box-shadow:
      inset 0 1px 0 #ffffff,
      0 calc(var(--tw) * 0.13) 0 var(--jade),
      0 calc(var(--tw) * 0.2) calc(var(--tw) * 0.22) rgba(0, 0, 0, 0.5);
    cursor: default;
  }
  .tile svg { display: block; width: 100%; height: 100%; }
  .tile svg text { font-family: var(--font-display); font-weight: 800; }
  button.tile { cursor: pointer; }
  button.tile:active { transform: translateY(calc(var(--tw) * 0.08)); }
  .tile.custom { padding: 0; background: transparent; border-radius: calc(var(--tw) * 0.1); }
  .tile.sm { --tw: 28px; }
  .tile.xs { --tw: 20px; }

  /* ---------- home ---------- */
  .brand { font-family: var(--font-title); font-weight: 900; font-size: 34px; letter-spacing: 0.02em; line-height: 1.1; display: flex; align-items: center; gap: 8px; }
  .brand .oh { color: var(--brass); font-style: italic; text-shadow: 0 2px 0 #8c2f55; }
  .brand .pp { color: var(--ink); }
  .brand .logo { width: 34px; height: 34px; flex: none; }
  .pop { display: inline-block; animation: pop 0.5s ease-out; transform-origin: 50% 80%; }
  @keyframes pop { 0% { transform: scale(0.6, 1.3); } 40% { transform: scale(1.25, 0.8); } 70% { transform: scale(0.92, 1.1); } 100% { transform: scale(1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .brand .logo { animation: bob 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .pop, .brand .logo { animation: none; } }
  .tagline { color: var(--muted); font-size: 13px; }
  .strip {
    display: flex; justify-content: center; gap: 6px;
    padding: 18px 10px 20px;
    border-radius: 14px;
    border: 5px solid var(--wood);
    background: radial-gradient(circle at 50% 40%, var(--felt-hi), var(--felt-lo) 75%);
  }
  .strip .tile { --tw: min(44px, calc((min(100vw, 560px) - 32px - 10px - 36px - 6px * 6) / 7)); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .seg button { appearance: none; border: 0; border-radius: 9px; padding: 10px; font-size: 15px; font-weight: 700; background: transparent; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }
  .seg small { display: block; font-size: 11px; font-weight: 400; opacity: 0.85; }
  .courses { display: grid; gap: 10px; }
  .course {
    appearance: none; text-align: left; cursor: pointer;
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
    padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  }
  .course:active { background: var(--panel-hi); }
  .course .lv { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--brass); line-height: 1; }
  .course .lv small { display: block; font-family: var(--font-body); font-size: 10px; letter-spacing: 0.14em; color: var(--muted); font-weight: 400; margin-bottom: 4px; }
  .course b { display: block; font-size: 17px; }
  .course span.d { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .course .bst { text-align: right; font-size: 11px; color: var(--muted); }
  .course .bst b { font-family: var(--font-display); font-size: 20px; color: var(--ink); }
  .note { font-size: 12px; color: var(--muted); }
  .tip { display: block; text-align: center; padding: 12px; border-radius: 12px; background: var(--brass); color: var(--brass-ink); font-weight: 800; text-decoration: none; }
  .tip:active { filter: brightness(0.92); }

  /* ---------- play ---------- */
  .headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .snd { appearance: none; flex: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 36px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; cursor: pointer; color: var(--brass); }
  .snd[aria-pressed="false"] { color: var(--dim); }
  .hud .left { display: flex; gap: 6px; }
  .hud { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .back { appearance: none; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .hud .title { text-align: center; font-size: 13px; color: var(--muted); line-height: 1.3; }
  .hud .title b { display: block; color: var(--ink); font-size: 14px; }
  .hud .score { text-align: right; line-height: 1.2; }
  .hud .score small { display: block; font-size: 10px; letter-spacing: 0.12em; color: var(--muted); }
  .hud .score b { font-family: var(--font-display); font-size: 20px; }
  .timer { display: flex; align-items: center; gap: 10px; }
  .timer .track { flex: 1; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .timer .track i { display: block; height: 100%; width: 100%; background: var(--brass); }
  .timer .track i.low { background: var(--bad); }
  .timer span { width: 3.2em; text-align: right; font-weight: 700; }

  .table {
    --S: min(calc(100vw - 32px), 520px);
    position: relative;
    width: var(--S); height: var(--S);
    margin: 0 auto;
    border-radius: 18px;
    border: 6px solid var(--wood);
    background: radial-gradient(circle at 50% 46%, var(--felt-hi), var(--felt-lo) 72%);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.45), 0 10px 24px rgba(0, 0, 0, 0.5);
  }
  .river {
    --tw: calc(var(--S) * 0.046);
    position: absolute;
    display: grid;
    grid-template-columns: repeat(6, var(--tw));
    gap: calc(var(--tw) * 0.08);
    align-content: start;
    --rw: calc(var(--tw) * 6.4);
  }
  .river .tile { --tw: calc(var(--S) * 0.046); box-shadow: 0 calc(var(--tw) * 0.1) 0 var(--jade), 0 calc(var(--tw) * 0.15) calc(var(--tw) * 0.2) rgba(0, 0, 0, 0.45); }
  .river.s0 { left: 50%; top: 65%; transform: translateX(-50%); }
  .river.s2 { left: 50%; bottom: 65%; transform: translateX(-50%) rotate(180deg); }
  .river.s1 { left: 65%; top: calc(50% + var(--rw) / 2); transform-origin: 0 0; transform: rotate(-90deg); }
  .river.s3 { left: 35%; top: calc(50% - var(--rw) / 2); transform-origin: 0 0; transform: rotate(90deg); }
  .plate {
    position: absolute; left: 50%; top: 50%;
    width: 30%; aspect-ratio: 1; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: 10px;
    background: rgba(5, 20, 15, 0.55);
    border: 1px solid rgba(216, 180, 90, 0.4);
    text-align: center;
  }
  .plate .kyoku { font-family: var(--font-display); font-weight: 800; font-size: calc(var(--S) * 0.05); color: var(--brass); line-height: 1.1; }
  .plate .sub { font-size: calc(var(--S) * 0.028); color: var(--ink); line-height: 1.3; }
  .plate .dr { display: flex; align-items: center; gap: 4px; font-size: calc(var(--S) * 0.026); color: var(--muted); margin-top: 2px; }
  .plate .dr .tile { --tw: calc(var(--S) * 0.05); }
  .plate .dr .arrow { color: var(--brass); }

  .hand {
    --tw: min(46px, calc((min(100vw, 560px) - 32px - 26px) / 14.5));
    display: flex; justify-content: center; align-items: flex-end; gap: 2px;
    padding-top: 16px;
  }
  .hand .tile { --tw: min(46px, calc((min(100vw, 560px) - 32px - 26px) / 14.5)); }
  .hand .tile.drawn { margin-left: calc(var(--tw) * 0.45); }
  .tile.dora::before {
    content: "★";
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-body); font-size: 11px; color: var(--brass); line-height: 1;
  }
  .tile.pick { transform: translateY(-10px); outline: 2px solid var(--brass); outline-offset: 1px; }
  .tile.best::after {
    content: "◎";
    position: absolute; bottom: calc(var(--tw) * -0.62); left: 50%; transform: translateX(-50%);
    font-family: var(--font-body); font-size: 12px; color: var(--good); line-height: 1; font-weight: 700;
  }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* ---------- panels ---------- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .btn {
    appearance: none; width: 100%; border: 0; border-radius: 10px; padding: 14px 16px;
    font-size: 16px; font-weight: 700; cursor: pointer; background: var(--brass); color: var(--brass-ink);
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-row { display: grid; gap: 10px; margin-top: 12px; }
  .verdict { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .verdict .word { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.2; }
  .verdict .word.good { color: var(--good); }
  .verdict .word.mid { color: var(--brass); }
  .verdict .word.bad { color: var(--bad); }
  .verdict .pts { font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: 1; }
  .verdict .why { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .rank-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 8px; }
  .rank-head h3 { font-size: 14px; }
  .ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 1.6em 28px 1fr; gap: 10px; align-items: start; padding: 8px 10px 10px; border-radius: 10px; border: 1px solid var(--line); }
  .row.is-pick { border-color: var(--brass); background: rgba(216, 180, 90, 0.1); }
  .row .rk { font-family: var(--font-display); font-weight: 800; font-size: 18px; text-align: center; line-height: 28px; }
  .row.is-best .rk { color: var(--good); }
  .row .info { min-width: 0; }
  .row .line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; flex-wrap: wrap; }
  .row .line em { font-style: normal; color: var(--muted); }
  .row .bar { height: 5px; border-radius: 3px; background: var(--line); margin: 5px 0 4px; overflow: hidden; }
  .row .bar i { display: block; height: 100%; background: var(--good); }
  .row.worse .bar i { background: var(--dim); }
  .row .acc { display: flex; flex-wrap: wrap; gap: 8px 6px; padding-bottom: 4px; }
  .chip { display: inline-flex; align-items: flex-end; gap: 2px; }
  .chip small { font-size: 10px; color: var(--muted); line-height: 1; }
  .tag { font-size: 11px; font-weight: 700; color: var(--brass); margin-left: 6px; }

  .grade { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.1; color: var(--brass); }
  .big-score { font-family: var(--font-display); font-weight: 800; font-size: 30px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .summary div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .summary small { display: block; font-size: 11px; color: var(--muted); }
  .summary b { font-family: var(--font-display); font-size: 20px; }
  .log { list-style: none; margin: 0; padding: 0; display: grid; font-size: 13px; }
  .log li { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .log .ok { color: var(--good); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* 牌効率エンジン v2: 0-8 萬子 / 9-17 筒子 / 18-26 索子 / 27-33 東南西北白發中
   opts = { sanma: boolean, level: 1 | 2 | 3 }
   level 1: 手牌だけ / level 2: 河とドラ表示牌を見る / level 3: 聴牌から待ちを選ぶ */
const TERM = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];

function allowedMask(sanma) {
  const m = new Array(34).fill(true);
  if (sanma) {
    for (let i = 1; i <= 7; i++) m[i] = false; /* 2〜8萬を抜く */
    m[30] = false; /* 北は抜きドラ扱いで手牌・河に出さない */
  }
  return m;
}

function shStd(c) {
  let best = 8;
  function dfs(i, m, t, p) {
    while (i < 34 && c[i] === 0) i++;
    if (i >= 34) {
      const tt = Math.min(t, 4 - m);
      const s = 8 - 2 * m - tt - p;
      if (s < best) best = s;
      return;
    }
    if (c[i] >= 3) { c[i] -= 3; dfs(i, m + 1, t, p); c[i] += 3; }
    if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
      c[i]--; c[i + 1]--; c[i + 2]--;
      dfs(i, m + 1, t, p);
      c[i]++; c[i + 1]++; c[i + 2]++;
    }
    if (!p && c[i] >= 2) { c[i] -= 2; dfs(i, m, t, 1); c[i] += 2; }
    if (c[i] >= 2 && m + t < 4) { c[i] -= 2; dfs(i, m, t + 1, p); c[i] += 2; }
    if (i < 27 && i % 9 <= 7 && c[i + 1] > 0 && m + t < 4) {
      c[i]--; c[i + 1]--; dfs(i, m, t + 1, p); c[i]++; c[i + 1]++;
    }
    if (i < 27 && i % 9 <= 6 && c[i + 2] > 0 && m + t < 4) {
      c[i]--; c[i + 2]--; dfs(i, m, t + 1, p); c[i]++; c[i + 2]++;
    }
    c[i]--; dfs(i, m, t, p); c[i]++;
  }
  dfs(0, 0, 0, 0);
  return best;
}

function shChi(c) {
  let pairs = 0, kinds = 0;
  for (let i = 0; i < 34; i++) {
    if (c[i] > 0) kinds++;
    if (c[i] >= 2) pairs++;
  }
  return 6 - pairs + Math.max(0, 7 - kinds);
}

function shKok(c) {
  let kinds = 0, pair = 0;
  for (const i of TERM) {
    if (c[i] > 0) kinds++;
    if (c[i] >= 2) pair = 1;
  }
  return 13 - kinds - pair;
}

function shanten(c) {
  return Math.min(shStd(c), shChi(c), shKok(c));
}

function isRelevant(c, t, kokushiLive, mask) {
  if (mask && !mask[t]) return false;
  if (c[t] >= 4) return false;
  if (c[t] > 0) return true;
  if (kokushiLive && TERM.includes(t)) return true;
  if (t >= 27) return false;
  const b = Math.floor(t / 9) * 9;
  for (let d = -2; d <= 2; d++) {
    const u = t + d;
    if (u >= b && u < b + 9 && c[u] > 0) return true;
  }
  return false;
}

/* 13枚の手牌で、向聴数を進める牌と枚数(手牌と場に見えている分を引く) */
function ukeire(c, sh, vis, mask) {
  const live = shKok(c) === sh;
  const tiles = [];
  let total = 0;
  for (let t = 0; t < 34; t++) {
    if (!isRelevant(c, t, live, mask)) continue;
    const n = 4 - c[t] - (vis ? vis[t] : 0);
    if (n <= 0) continue;
    c[t]++;
    const s = shanten(c);
    c[t]--;
    if (s < sh) {
      tiles.push({ t, n });
      total += n;
    }
  }
  return { total, tiles };
}

function termRank(t) {
  if (t >= 27) return 0;
  const r = t % 9;
  return r === 0 || r === 8 ? 1 : 2;
}

function doraOf(i, sanma) {
  if (i < 27) {
    if (sanma && i < 9) return i === 0 ? 8 : 0;
    return i % 9 === 8 ? i - 8 : i + 1;
  }
  if (i < 31) return i === 30 ? 27 : i + 1;
  return i === 33 ? 31 : i + 1;
}

function yakuhaiList(ctx) {
  return ctx.level === 1 ? [] : [31, 32, 33, ctx.roundWind, ctx.seatWind];
}

function rnd(n) { return Math.floor(Math.random() * n); }

/* 場況: 局・風・巡目・ドラ表示牌・各家の河。level 1 は何も見えない */
function makeContext(c, opts) {
  const sanma = !!opts.sanma;
  const level = opts.level;
  const mask = allowedMask(sanma);
  const players = sanma ? 3 : 4;
  const roundWind = Math.random() < 0.7 ? 27 : 28;
  const kyoku = 1 + rnd(4);
  const seatWind = 27 + rnd(players);
  const vis = new Array(34).fill(0);
  if (level === 1) {
    return { sanma, level, players, mask, roundWind, kyoku, seatWind, turn: 0, indicator: -1, dora: -1, rivers: [], vis };
  }
  const turn = level === 3 ? 6 + rnd(5) : 5 + rnd(6);
  const pool = c.map((x, t) => (mask[t] ? 4 - x : 0));
  let ind;
  do { ind = rnd(34); } while (pool[ind] <= 0 || (sanma && (ind === 29 || ind === 30)));
  pool[ind]--;
  const weight = (t) => (t >= 27 ? 3 : t % 9 === 0 || t % 9 === 8 ? 2.2 : t % 9 === 1 || t % 9 === 7 ? 1.4 : 1);
  const rivers = [];
  for (let r = 0; r < players; r++) {
    const rv = [];
    for (let k = 0; k < turn - 1; k++) {
      let total = 0;
      for (let t = 0; t < 34; t++) if (pool[t] > 0) total += weight(t);
      let x = Math.random() * total, pick = -1;
      for (let t = 0; t < 34; t++) {
        if (pool[t] <= 0) continue;
        x -= weight(t);
        if (x <= 0) { pick = t; break; }
      }
      if (pick < 0) continue;
      pool[pick]--;
      rv.push(pick);
    }
    rivers.push(rv);
  }
  vis[ind]++;
  rivers.forEach((rv) => rv.forEach((t) => { vis[t]++; }));
  return { sanma, level, players, mask, roundWind, kyoku, seatWind, turn, indicator: ind, dora: doraOf(ind, sanma), rivers, vis };
}

/* 同点時の打点材料: ドラ枚数と、対子以上になっている役牌 */
function valueOf(c, ctx) {
  const dora = ctx.dora >= 0 ? c[ctx.dora] : 0;
  let yak = 0;
  for (const t of yakuhaiList(ctx)) if (c[t] >= 2) yak += 1;
  return { dora, yak, val: dora * 2 + yak * 2 };
}

/* 14枚の手牌から、切る牌ごとの評価を作り、良い順に並べる */
function evalHand(c, ctx) {
  const vis = ctx ? ctx.vis : null;
  const mask = ctx ? ctx.mask : null;
  const out = [];
  for (let t = 0; t < 34; t++) {
    if (c[t] === 0) continue;
    c[t]--;
    const sh = shanten(c);
    const u = ukeire(c, sh, vis, mask);
    const v = ctx ? valueOf(c, ctx) : { dora: 0, yak: 0, val: 0 };
    c[t]++;
    out.push({ t, sh, uk: u.total, acc: u.tiles, dora: v.dora, yak: v.yak, val: v.val });
  }
  out.sort((a, b) =>
    a.sh - b.sh || b.uk - a.uk || b.val - a.val || termRank(a.t) - termRank(b.t) || a.t - b.t);
  let rank = 0;
  out.forEach((e, i) => {
    if (i === 0 || e.sh !== out[i - 1].sh || e.uk !== out[i - 1].uk) rank = i + 1;
    e.rank = rank;
  });
  return out;
}

function minDiscardShanten(c) {
  let best = 9;
  for (let t = 0; t < 34; t++) {
    if (c[t] === 0) continue;
    c[t]--;
    const s = shanten(c);
    c[t]++;
    if (s < best) best = s;
  }
  return best;
}

function genTools(opts) {
  const mask = allowedMask(!!opts.sanma);
  const suitsAvail = opts.sanma ? [1, 2] : [0, 1, 2];
  const order = suitsAvail.slice().sort(() => Math.random() - 0.5);
  const main = order[0], sub = order[1];
  const pickSuit = () => {
    const r = Math.random();
    return r < 0.62 ? main : r < 0.9 ? sub : suitsAvail[rnd(suitsAvail.length)];
  };
  const randHonor = () => {
    let t;
    do { t = 27 + rnd(7); } while (!mask[t]);
    return t;
  };
  return { mask, pickSuit, randHonor };
}

function buildCandidate(opts) {
  const { mask, pickSuit, randHonor } = genTools(opts);
  const c = new Array(34).fill(0);
  let cnt = 0;
  const add = (i) => { if (i >= 0 && i < 34 && mask[i] && c[i] < 4) { c[i]++; cnt++; } };

  const melds = 2 + rnd(2);
  for (let k = 0; k < melds; k++) {
    const s = pickSuit();
    if (Math.random() < 0.82) {
      const st = rnd(7);
      add(s * 9 + st); add(s * 9 + st + 1); add(s * 9 + st + 2);
    } else {
      const v = rnd(9);
      add(s * 9 + v); add(s * 9 + v); add(s * 9 + v);
    }
  }
  const pv = Math.random() < 0.25 ? randHonor() : pickSuit() * 9 + rnd(9);
  add(pv); add(pv);
  const taatsu = 1 + rnd(2);
  for (let k = 0; k < taatsu; k++) {
    const s = pickSuit();
    if (Math.random() < 0.65) {
      const st = rnd(8);
      add(s * 9 + st); add(s * 9 + st + 1);
    } else {
      const st = rnd(7);
      add(s * 9 + st); add(s * 9 + st + 2);
    }
  }
  while (cnt > 14) {
    const t = rnd(34);
    if (c[t] > 0) { c[t]--; cnt--; }
  }
  let guard = 0;
  while (cnt < 14 && guard++ < 200) {
    const r = Math.random();
    add(r < 0.22 ? randHonor() : r < 0.85 ? pickSuit() * 9 + rnd(9) : pickSuit() * 9 + rnd(9));
  }
  if (cnt !== 14) return null;
  for (let t = 0; t < 34; t++) if (c[t] > 0 && !mask[t]) return null;
  return { c, drawn: -1 };
}

/* 聴牌の13枚 + 引いてきた1枚 */
function buildTenpai(opts) {
  const { mask, pickSuit, randHonor } = genTools(opts);
  const c = new Array(34).fill(0);
  let cnt = 0;
  const add = (i) => { if (i >= 0 && i < 34 && mask[i] && c[i] < 4) { c[i]++; cnt++; } };
  for (let k = 0; k < 3; k++) {
    const s = pickSuit();
    if (Math.random() < 0.82) {
      const st = rnd(7);
      add(s * 9 + st); add(s * 9 + st + 1); add(s * 9 + st + 2);
    } else {
      const v = rnd(9);
      add(s * 9 + v); add(s * 9 + v); add(s * 9 + v);
    }
  }
  const pv = Math.random() < 0.2 ? randHonor() : pickSuit() * 9 + rnd(9);
  add(pv); add(pv);
  const s = pickSuit();
  const r = Math.random();
  if (r < 0.5) { const st = rnd(8); add(s * 9 + st); add(s * 9 + st + 1); }
  else if (r < 0.85) { const st = rnd(7); add(s * 9 + st); add(s * 9 + st + 2); }
  else { const st = Math.random() < 0.5 ? 0 : 7; add(s * 9 + st); add(s * 9 + st + 1); }
  if (cnt !== 13) return null;
  if (shanten(c) !== 0) return null;
  const q = Math.random();
  const dr = q < 0.2 ? randHonor() : pickSuit() * 9 + rnd(9);
  if (!mask[dr] || c[dr] >= 4) return null;
  c[dr]++;
  if (shanten(c) < 0) return null;
  return { c, drawn: dr };
}

function genHand(opts) {
  const level = opts.level;
  for (let n = 0; n < 1500; n++) {
    const cand = level === 3 ? buildTenpai(opts) : buildCandidate(opts);
    if (!cand) continue;
    const c = cand.c;
    if (shanten(c) < 0) continue;
    if (level !== 3) {
      const m = minDiscardShanten(c);
      if (m < 1 || m > 2) continue;
    }
    const ctx = makeContext(c, opts);
    const ev = evalHand(c, ctx);
    const top = ev.filter((e) => e.sh === ev[0].sh);
    const tiedBest = ev.filter((e) => e.rank === 1).length;
    if (ev[0].uk === 0 || tiedBest > 2) continue;
    if (level === 3) {
      if (ev[0].sh !== 0 || top.length < 2) continue;
      if (new Set(top.map((e) => e.uk)).size < 2) continue;
      if (ev[0].t === cand.drawn && Math.random() < 0.6) continue;
    } else if (ev.length < 6 || top.length < 3) continue;
    const hand = [];
    for (let t = 0; t < 34; t++) for (let k = 0; k < c[t]; k++) hand.push(t);
    const drawn = cand.drawn >= 0 ? cand.drawn : hand[rnd(hand.length)];
    return { hand, drawn, evals: ev, ctx };
  }
  return null;
}

      var sec = document.getElementById("tsec");
      if (bar) { bar.style.width = (left / limit() * 100) + "%"; bar.className = left < 3000 ? "low" : ""; }
      if (sec) sec.textContent = (left / 1000).toFixed(1);
      if (left <= 3200 && left > 0 && lastTick === 99) { lastTick = 0; sfx("count"); }
      if (left <= 0) answer(null);
    }, 80);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  function answer(t) {
    if (S.phase !== "play") return;
    stopTimer();
    var left = Math.max(0, limit() - (performance.now() - S.t0));
    var top = S.evals[0];
    var res = { t: t, timeout: t == null, base: 0, bonus: 0, pts: 0, isBest: false, sameSh: false, ev: null };
    if (t != null) {
      var ev = S.evals.filter(function (e) { return e.t === t; })[0];
      res.ev = ev;
      res.isBest = ev.sh === top.sh && ev.uk === top.uk;
      res.sameSh = ev.sh === top.sh;
      if (res.isBest) res.base = 100;
      else if (res.sameSh) res.base = top.uk > 0 ? Math.round(70 * ev.uk / top.uk) : 70;
      if (res.isBest) { res.bonus = Math.round(20 * left / limit()); S.bestCount += 1; }
      res.pts = res.base + res.bonus;
    }
    S.score += res.pts;
    S.last = res;
    stopVoices();
    if (!res.timeout) sfx("discard");
    sfx(res.timeout ? "timeout" : res.isBest ? "best" : res.sameSh ? "good" : "bad", res.timeout ? 0 : 0.14);
    S.log.push({ q: S.q, t: t, bestT: top.t, pts: res.pts, isBest: res.isBest });
    go("review");
  }

  function finish() {
    stopTimer();
    S.newBest = S.score > getBest(mode, S.level);
    if (S.newBest) setBest(mode, S.level, S.score);
    stopVoices();
    sfx(S.newBest ? "fanfare" : "end");
    go("result");
    window.scrollTo(0, 0);
  }

  function leave() { stopTimer(); S = null; render(); window.scrollTo(0, 0); }

  /* ---------- views ---------- */
  function homeView() {
    var strip = h("div", { class: "strip", "aria-hidden": "true" }, [31, 10, 22, 5, 33, 15, 27].map(function (t) { return tileEl(t); }));
    var seg = h("div", { class: "seg", role: "group", "aria-label": "人数" },
      h("button", { type: "button", "aria-pressed": String(mode === "4"), onclick: function () { setMode("4"); } }, "四麻", h("small", null, "4人打ち")),
      h("button", { type: "button", "aria-pressed": String(mode === "3"), onclick: function () { setMode("3"); } }, "三麻", h("small", null, "3人打ち・2〜8萬と北なし"))
    );
    var cards = [1, 2, 3].map(function (lv) {
      var b = getBest(mode, lv);
      return h("button", { class: "course", type: "button", onclick: function () { openCourse(lv); } },
        h("div", { class: "lv" }, h("small", null, "LEVEL"), lv),
        h("div", null, h("b", null, LEVELS[lv].name), h("span", { class: "d" }, LEVELS[lv].desc)),
        h("div", { class: "bst num" }, b ? [h("small", null, "ベスト"), h("b", null, b)] : "未挑戦")
      );
    });
    return [
      h("header", { class: "headrow" }, h("div", null, h("h1", { class: "brand", "aria-label": "Oh!!牌牌" }, h("span", { class: "logo", html: LOGO }), h("span", { class: "oh" }, "Oh!!"), h("span", { class: "pp" }, "牌牌")), h("p", { class: "tagline" }, "ぷるんと切って、ぽよんと上達。10問の何切る")), sndBtn()),
      strip,
      seg,
      h("div", { class: "courses" }, cards),
      h("p", { class: "note" }, "判定は牌効率(向聴数 → 受け入れ枚数)です。同点のときだけドラ・役牌を残す切りを上位にします。オフラインでも遊べます。"),
      tipLink()
    ];
  }

  function setMode(m) {
    mode = m;
    try { localStorage.setItem("nk2-mode", m); } catch (e) {}
    render();
  }

  function hudView() {
    return h("div", { class: "hud" },
      h("div", { class: "left" }, h("button", { class: "back", type: "button", onclick: leave }, "‹ 戻る"), sndBtn()),
      h("div", { class: "title" }, h("b", null, "Lv." + S.level + " " + LEVELS[S.level].name), (S.sanma ? "三麻" : "四麻") + " ・ " + S.q + "/" + TOTAL_Q + "問"),
      h("div", { class: "score num" }, h("small", null, "SCORE"), h("b", null, S.score))
    );
  }

  function timerView() {
    return h("div", { class: "timer", "aria-hidden": "true" },
      h("div", { class: "track" }, h("i", { id: "tbar" })),
      h("span", { class: "num", id: "tsec" }, (limit() / 1000).toFixed(1))
    );
  }

  function tableView() {
    var c = S.ctx;
    var pos = c.players === 4 ? ["s0", "s1", "s2", "s3"] : ["s0", "s1", "s3"];
    var rivers = c.rivers.map(function (rv, i) {
      return h("div", { class: "river " + pos[i], "aria-label": "河" }, rv.map(function (t) { return tileEl(t, { small: true }); }));
    });
    var plateKids = [
      h("div", { class: "kyoku" }, windName(c.roundWind) + c.kyoku + "局"),
      h("div", { class: "sub" }, windName(c.seatWind) + "家" + (c.turn ? " ・ " + c.turn + "巡目" : ""))
    ];
    if (c.dora >= 0) {
      plateKids.push(h("div", { class: "dr" }, "ドラ", tileEl(c.indicator, { small: true }), h("span", { class: "arrow" }, "→"), tileEl(c.dora, { small: true })));
    } else {
      plateKids.push(h("div", { class: "dr" }, "手牌だけで判断"));
    }
    return h("div", { class: "table", "aria-label": "卓" }, rivers, h("div", { class: "plate" }, plateKids));
  }

  function handView(reviewing) {
    var pickT = reviewing && S.last ? S.last.t : null;
    var top = S.evals[0];
    var bestSet = {};
    if (reviewing) S.evals.forEach(function (e) { if (e.sh === top.sh && e.uk === top.uk) bestSet[e.t] = true; });
    var markedPick = false, markedBest = {};
    function cls(t, isDrawn) {
      var k = [];
      if (isDrawn) k.push("drawn");
      if (t === S.ctx.dora) k.push("dora");
      if (reviewing && t === pickT && !markedPick) { k.push("pick"); markedPick = true; }
      if (reviewing && bestSet[t] && !markedBest[t]) { k.push("best"); markedBest[t] = true; }
      return k.join(" ");
    }
    var go1 = function (t) { return reviewing ? null : function () { answer(t); }; };
    var tiles = S.hand13.map(function (t) { return tileEl(t, { cls: cls(t, false), onclick: go1(t) }); });
    tiles.push(tileEl(S.drawn, { cls: cls(S.drawn, true), onclick: go1(S.drawn) }));
    return h("div", { class: "hand", "aria-label": "手牌" }, tiles);
  }

  function rankingView() {
    var top = S.evals[0];
    var maxUk = Math.max.apply(null, S.evals.map(function (e) { return e.uk; })) || 1;
    var pickT = S.last ? S.last.t : null;
    var rows = S.evals.map(function (e) {
      var isBest = e.sh === top.sh && e.uk === top.uk;
      var isPick = e.t === pickT;
      var chips = (isBest || isPick) ? e.acc.map(function (a) {
        return h("span", { class: "chip" }, tileEl(a.t, { cls: "xs", small: true }), h("small", { class: "num" }, "×" + a.n));
      }) : [];
      var mats = [];
      if (e.dora > 0) mats.push("ドラ" + e.dora);
      if (e.yak > 0) mats.push("役牌" + e.yak);
      return h("li", { class: "row" + (isPick ? " is-pick" : "") + (isBest ? " is-best" : "") + (e.sh > top.sh ? " worse" : "") },
        h("span", { class: "rk num" }, e.rank),
        tileEl(e.t, { cls: "sm" }),
        h("div", { class: "info" },
          h("div", { class: "line" },
            h("span", null, h("b", null, tileName(e.t) + "切り"), isPick ? h("span", { class: "tag" }, "あなた") : null),
            h("span", null, h("b", null, shLabel(e.sh)), " ", h("em", { class: "num" }, "受け入れ " + e.uk + "枚"), mats.length ? h("em", null, " ・残す " + mats.join(" ")) : null)
          ),
          h("div", { class: "bar" }, h("i", { style: "width:" + Math.round(e.uk / maxUk * 100) + "%" })),
          chips.length ? h("div", { class: "acc" }, chips) : null
        )
      );
    });
    return [
      h("div", { class: "rank-head" }, h("h3", null, "ランキング"), h("span", { class: "note" }, "向聴数 → 受け入れ枚数の順")),
      h("ol", { class: "ranking" }, rows)
    ];
  }

  function reviewView() {
    var r = S.last, top = S.evals[0];
    var word, cls, why;
    if (r.timeout) { word = "時間切れ"; cls = "bad"; why = "制限時間内に切る牌を選びましょう。"; }
    else if (r.isBest) { word = "最善手! ぽよ〜ん♪"; cls = "good"; why = "基本" + r.base + " + スピード" + r.bonus; }
    else if (r.sameSh) { word = "惜しい! もうちょい♡"; cls = "mid"; why = "最善は" + tileName(top.t) + "切り(受け入れ" + top.uk + "枚)。あなたは" + r.ev.uk + "枚でした。"; }
    else { word = "向聴数が後退"; cls = "bad"; why = "最善は" + tileName(top.t) + "切りで" + shLabel(top.sh) + "。あなたの切りは" + shLabel(r.ev.sh) + "です。"; }
    return h("section", { class: "panel" },
      h("div", { class: "verdict" },
        h("div", null, h("p", { class: "word " + cls + (r.isBest ? " pop" : "") }, word), h("p", { class: "why" }, why)),
        h("div", { class: "pts num" }, "+" + r.pts)
      ),
      h("div", { class: "btn-row" }, h("button", { class: "btn", type: "button", onclick: nextQuestion }, S.q >= TOTAL_Q ? "結果を見る" : "次の問題へ")),
      rankingView()
    );
  }

  function resultView() {
    var rows = S.log.map(function (l) {
      return h("li", null,
        h("span", { class: "num" }, "Q" + l.q),
        h("span", null, l.t == null ? "時間切れ" : tileName(l.t) + "切り", l.isBest ? h("span", { class: "ok" }, " ◎") : h("span", { class: "note" }, "  最善 " + tileName(l.bestT))),
        h("span", { class: "num" }, "+" + l.pts)
      );
    });
    var label = (S.sanma ? "三麻" : "四麻") + " Lv." + S.level + " " + LEVELS[S.level].name;
    var text = "Oh!!牌牌 " + label + " " + S.score + "点 / 最善手 " + S.bestCount + "/" + TOTAL_Q;
    var shareBtn = h("button", { class: "btn ghost", type: "button", onclick: function () {
      var done = function () { shareBtn.textContent = "コピーしました"; };
      var fail = function () { shareBtn.textContent = text; };
      try {
        if (navigator.share) navigator.share({ text: text }).catch(function () {});
        else navigator.clipboard.writeText(text).then(done, fail);
      } catch (e) { fail(); }
    } }, "結果を共有・コピー");
    return h("section", { class: "panel" },
      h("p", { class: "note" }, label),
      h("div", { class: "grade" }, S.bestCount + "/" + TOTAL_Q),
      h("div", { class: "big-score num" }, S.score + "点", S.newBest ? h("span", { class: "tag", style: "font-size:13px;font-family:var(--font-body)" }, "ベスト更新") : null),
      h("div", { class: "summary num" },
        h("div", null, h("small", null, "最善手"), h("b", null, S.bestCount + "/" + TOTAL_Q)),
        h("div", null, h("small", null, "スコア"), h("b", null, S.score)),
        h("div", null, h("small", null, "ベスト"), h("b", null, getBest(mode, S.level)))
      ),
      h("ul", { class: "log" }, rows),
      h("div", { class: "btn-row" },
        h("button", { class: "btn", type: "button", onclick: function () { openCourse(S.level); } }, "もう一度"),
        shareBtn,
        h("button", { class: "btn ghost", type: "button", onclick: leave }, "コース選択へ")
      ),
      tipLink()
    );
  }

  function render() {
    var kids;
    if (!S) { stopTimer(); kids = homeView(); }
    else if (S.phase === "play") kids = [hudView(), timerView(), tableView(), handView(false), h("p", { class: "hint" }, "切る牌をタップ")];
    else if (S.phase === "review") kids = [hudView(), tableView(), handView(true), reviewView()];
    else kids = [hudView(), resultView()];
    app.replaceChildren.apply(app, kids);
    if (S && S.phase === "play") startTimer();
  }

  render();
  
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
